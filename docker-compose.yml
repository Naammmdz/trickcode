name: trickcode

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────
  postgresql:
    image: postgres:17.4
    environment:
      POSTGRES_USER: trickcode
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trickcode}
      POSTGRES_DB: trickcode
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trickcode"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── MinIO (Object Storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── Backend (Spring Boot) ──────────────────────────────────────
  backend:
    build:
      context: ./be/backend-mono
      dockerfile: Dockerfile
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/trickcode
      - SPRING_DATASOURCE_USERNAME=trickcode
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-trickcode}
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgresql:5432/trickcode
      # ─── External API Keys (from root .env) ───
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}
      - JDOODLE_CLIENT_ID=${JDOODLE_CLIENT_ID}
      - JDOODLE_CLIENT_SECRET=${JDOODLE_CLIENT_SECRET}
      # ─── MinIO ───
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      # ─── VNPay ───
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/management/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      postgresql:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ─── Frontend (Vite + Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        # Vite injects this at build time
        VITE_API_BASE_URL: ""
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
