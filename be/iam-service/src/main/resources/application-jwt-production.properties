# ==================================================
# PRODUCTION MICROSERVICE JWT CONFIGURATION
# ==================================================
# This configuration uses persistent RSA keys instead of in-memory keys
# Perfect for microservice architectures with multiple instances

# Core JWT Settings
mp.jwt.verify.issuer=https://iam-service.yourcompany.com
mp.jwt.verify.audiences=iam-service,user-service,order-service
mp.jwt.verify.publickey.location=publicKey.pem

# SmallRye JWT Signing (Persistent Keys)
smallrye.jwt.sign.key.location=keystore.jks
smallrye.jwt.keystore.type=PKCS12
smallrye.jwt.keystore.password=${JWT_KEYSTORE_PASSWORD:secret}
smallrye.jwt.keystore.sign.key.alias=${JWT_KEY_ALIAS:mykey}
smallrye.jwt.keystore.sign.key.password=${JWT_KEY_PASSWORD:secret}

# Algorithm and Security
smallrye.jwt.sign.algorithm=RS256
quarkus.smallrye-jwt.enabled=true

# Token Expiration (Production values)
# Access token: 15 minutes for security
# Refresh token: 7 days for user convenience
jwt.access.token.expiry=15m
jwt.refresh.token.expiry=7d

# Environment-specific overrides
%dev.mp.jwt.verify.issuer=https://example.com/issuer
%dev.jwt.access.token.expiry=30m
%dev.jwt.refresh.token.expiry=1d

%test.mp.jwt.verify.issuer=https://test.example.com/issuer
%test.jwt.access.token.expiry=5m

%prod.mp.jwt.verify.issuer=${JWT_ISSUER}
%prod.smallrye.jwt.keystore.password=${JWT_KEYSTORE_PASSWORD}
%prod.smallrye.jwt.keystore.sign.key.password=${JWT_KEY_PASSWORD}
%prod.jwt.access.token.expiry=15m
%prod.jwt.refresh.token.expiry=7d