quarkus.http.port=9000

# Application Info
quarkus.application.name=iam-service
quarkus.application.version=1.0.0

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=12345
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/iamdb

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# JWT Configuration - Persistent Keys for Microservices
mp.jwt.verify.issuer=https://example.com/issuer
mp.jwt.verify.audiences=iam-service
# Verify JWTs using local public key to avoid Thread blocked issues
mp.jwt.verify.publickey.location=classpath:publicKey.pem

# SmallRye JWT signing - Using your persistent keystore
smallrye.jwt.sign.key.location=keystore.jks
smallrye.jwt.keystore.type=PKCS12
smallrye.jwt.keystore.password=secret
smallrye.jwt.keystore.sign.key.alias=mykey
smallrye.jwt.keystore.sign.key.password=secret
smallrye.jwt.sign.algorithm=RS256

# Enable JWT processing
quarkus.smallrye-jwt.enabled=true

# OpenAPI/Swagger
quarkus.smallrye-openapi.path=/swagger
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

# CORS Configuration - Disabled because API Gateway handles CORS
# quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
# quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
# quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Redis
quarkus.redis.hosts=redis://localhost:6379

# Consul
consul.host=localhost
consul.port=8500
service.registration.address=localhost

# Mail
quarkus.mailer.mock=false
quarkus.mailer.from=qhuyddbmt123@gmail.com
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=465
quarkus.mailer.ssl=true
