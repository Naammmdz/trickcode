# Judge0 CE Configuration
# See: https://github.com/judge0/judge0/blob/master/judge0.conf

# PostgreSQL (separate instance for Judge0)
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0secret

# Redis
REDIS_HOST=judge0-redis

# Worker
RAILS_MAX_THREADS=4
RAILS_ENV=production
ALLOW_ORIGIN=*

# Execution limits
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=15
MEMORY_LIMIT=256000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=1024

# Maintenance mode (off)
MAINTENANCE_MODE=false
