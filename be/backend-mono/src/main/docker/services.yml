# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: trickcode
services:
  postgresql:
    extends:
      file: ./postgresql.yml
      service: postgresql
    profiles:
      - ''
      - dev
      - prod
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ~/volumes/jhipster/trickcode/minio/:/data
    ports:
      - 127.0.0.1:9002:9000
      - 127.0.0.1:9003:9001
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - ''
      - dev
      - prod
